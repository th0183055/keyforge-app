services:
  - type: web
    name: timlock-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TIMLOCK_DATA_DIR
        value: /var/data/timlock
    disk:
      name: timlock-data
      mountPath: /var/data/timlock
      sizeGB: 1
